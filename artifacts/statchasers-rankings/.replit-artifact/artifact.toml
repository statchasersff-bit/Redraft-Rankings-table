kind = "web"
previewPath = "/"
title = "StatChasers Rankings"
version = "1.0.0"
id = "artifacts/statchasers-rankings"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21374

[services.development]
run = "pnpm --filter @workspace/statchasers-rankings run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/statchasers-rankings", "run", "build" ]
publicDir = "artifacts/statchasers-rankings/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21374"
BASE_PATH = "/"
